<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>RIX</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="titlebar">
  <div class="tb-drag" id="drag">
    <button class="icon-btn burger" id="menuBtn" title="منو / Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <span class="tb-sep"></span>
    <span class="brand"><span class="logo"></span>RIX<span class="ver" id="ver"></span></span>
    <span class="tb-sep"></span>
    <span class="tb-state" id="tbState">آماده</span>
  </div>
  <div class="tb-actions">
    <button class="icon-btn social" id="tgBtn" title="Rix Channel — Telegram" aria-label="Telegram">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 4.3 2.9 11.5c-1 .4-1 1.9.1 2.2l4.6 1.4 1.7 5.4c.3.9 1.4 1.2 2 .5l2.5-2.4 4.6 3.4c.8.6 1.9.2 2.2-.8l3.2-15.2c.2-1-.7-1.9-1.7-1.5zM9.3 14.8l9-6.5-7.3 7.4-.4 3.1-1.3-4z"/></svg>
    </button>
    <button class="icon-btn social" id="ghBtn" title="Rix GitHub" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.7.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9v2.7c0 .3.2.6.7.5A10.1 10.1 0 0 0 22 12.2C22 6.6 17.5 2 12 2z"/></svg>
    </button>
    <button class="icon-btn" id="langBtn" title="زبان / Language">EN</button>
    <button class="icon-btn" id="themeBtn" title="پوسته / Theme">◐</button>
    <span class="sep"></span>
    <button class="win-btn" id="minBtn" title="کوچک">–</button>
    <button class="win-btn" id="maxBtn" title="بزرگ">▢</button>
    <button class="win-btn danger" id="closeBtn" title="بستن">✕</button>
  </div>
</header>

<!-- One place for everything that is not the connection itself. The dial owns
     the home screen; this drawer owns the rest, so the first screen stays
     what the user opened the app for. -->
<div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
<nav class="drawer hidden" id="drawer" aria-label="منو">
  <div class="drawer-head"><span class="logo"></span><b>RIX</b></div>
  <button class="drawer-item on" data-view="home"><span class="di-ico" id="diHome"></span><span class="di-label" id="dlHome"></span></button>
  <button class="drawer-item" data-view="scan"><span class="di-ico" id="diScan"></span><span class="di-label" id="dlScan"></span></button>
  <button class="drawer-item" data-view="settings"><span class="di-ico" id="diSettings"></span><span class="di-label" id="dlSettings"></span></button>
  <button class="drawer-item" data-view="details"><span class="di-ico" id="diDetails"></span><span class="di-label" id="dlDetails"></span></button>
  <button class="drawer-item" data-view="log"><span class="di-ico" id="diLog"></span><span class="di-label" id="dlLog"></span></button>
  <button class="drawer-item" data-view="about"><span class="di-ico" id="diAbout"></span><span class="di-label" id="dlAbout"></span></button>
</nav>

<main>

  <!-- -------------------------------------------------------------- home -->
  <section class="view on" id="view-home">
    <div class="home minimal">

      <div class="alert hidden" id="alert">
        <span class="alert-ico">!</span>
        <span id="alertText"></span>
      </div>

      <!-- Shown exactly once, when a connect found nothing scanned yet: the
           user runs one scan, the session starts on its winner, and every
           later connect is instant. Rescanning stays the user's choice, from
           the scanner view. -->
      <div class="scan-prompt hidden" id="scanPrompt">
        <span class="sp-text" id="scanPromptText"></span>
        <button class="ghost small" id="scanPromptBtn"></button>
        <button class="ghost small" id="scanPromptConnectBtn"></button>
      </div>

      <div class="dial-wrap">
        <button class="dial" id="connectBtn" aria-label="اتصال">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/>
          </svg>
          <span id="dialLabel">اتصال</span>
        </button>
      </div>

      <div class="dial-state" id="phaseText">آماده</div>
      <div class="dial-ip" id="heroIp">—</div>
      <div class="dial-sub" id="heroSub"></div>

      <!-- The one secondary action that earns a place on the home screen:
           keeping the app itself current. Everything else lives in the menu. -->
      <button class="ghost small" id="updateBtn">بررسی به‌روزرسانی</button>

      <!-- The scanner's heartbeat: one thin line, the best edge when there is
           one, and a click that opens the full scanner view. -->
      <button class="mini-scan" id="miniScan" data-view="scan">
        <span class="mini-track"><span class="mini-fill" id="miniFill"></span></span>
        <span class="mini-text" id="miniScanText">اسکنر: آماده</span>
      </button>

      <div class="fulltunnel-note hidden" id="tunnelNote"></div>

    </div>
  </section>

  <!-- ---------------------------------------------------------- scanner -->
  <section class="view" id="view-scan">
    <div class="scan-page">

      <div class="scan-card">
        <div class="scan-head">
          <b id="scanTitle">اسکنر لبه کلودفلر</b>
          <span class="scan-info" id="scanInfo"></span>
          <span class="hero-spacer"></span>
          <button class="ghost small" id="scanNowBtn">اسکن</button>
        </div>
        <div class="scan-track"><span class="scan-fill" id="scanFill"></span></div>
        <div class="scan-foot">
          <span id="scanCurrent"></span>
          <span class="hero-spacer"></span>
          <span id="scanBest"></span>
        </div>
        <div class="scan-list" id="scanList"></div>
        <p class="hint" id="scanNote"></p>
      </div>

      <div class="strip">
        <span class="stage" id="stCore"><i></i><b id="stCoreName">هسته</b></span>
        <span class="stage-arrow">→</span>
        <span class="stage" id="stListener"><i></i><b id="stListenerName">شنونده SOCKS5</b></span>
        <span class="stage-arrow" id="stPsiphonArrow">→</span>
        <span class="stage" id="stPsiphon"><i></i><b>Psiphon</b></span>
        <span class="stage-arrow" id="stTunnelArrow">→</span>
        <span class="stage" id="stTunnel"><i></i><b id="stTunnelName">تونل</b></span>
        <span class="stage-arrow" id="stExitArrow">→</span>
        <span class="stage" id="stExit"><i></i><b id="stExitName">خروج</b></span>
      </div>

      <div class="qa-row">
        <button class="ghost" id="proxyOffBtn">خاموش کردن پروکسی سیستم</button>
        <button class="ghost" id="probeBtn">بررسی</button>
      </div>

    </div>
  </section>

  <!-- ---------------------------------------------------------- settings -->
  <section class="view" id="view-settings">
    <div class="split">
      <aside class="cat" id="cat"></aside>
      <div class="cat-body">
        <div class="cat-head">
          <b id="catTitle"></b>
          <span id="catSub"></span>
        </div>
        <div class="fields" id="fields"></div>
      </div>
    </div>
  </section>

  <!-- ---------------------------------------------------------- details -->
  <section class="view" id="view-details">
    <div class="details">

      <div class="tiles">
        <div class="tile">
          <span class="tile-k" id="kTime">زمان اتصال</span>
          <b class="tile-v" id="vTime">00:00:00</b>
        </div>
        <div class="tile">
          <span class="tile-k" id="kYou">اتصال شما</span>
          <b class="tile-v small" id="vLocal">—</b>
          <span class="tile-m" id="mLocal"></span>
        </div>
        <div class="tile">
          <span class="tile-k" id="kProto">پروتکل</span>
          <b class="tile-v" id="vProto">—</b>
          <span class="tile-m" id="mProto"></span>
        </div>
        <div class="tile">
          <span class="tile-k" id="kRoute">مسیر خروج</span>
          <b class="tile-v small" id="vRoute">—</b>
          <span class="tile-m" id="mRoute"></span>
        </div>
        <div class="tile" id="tileBest">
          <span class="tile-k" id="kBest">آی‌پی بهینه</span>
          <b class="tile-v small" id="vBest">—</b>
          <span class="tile-m" id="mBest"></span>
        </div>
        <div class="tile" id="tileLatency">
          <span class="tile-k" id="kLatency">تأخیر</span>
          <b class="tile-v" id="vLatency">—</b>
          <span class="tile-m" id="mLatency"></span>
        </div>
        <div class="tile" id="tileCore">
          <span class="tile-k" id="kCoreState">Rix Core</span>
          <b class="tile-v small" id="vCoreState">—</b>
          <span class="tile-m" id="mCoreState"></span>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-head">
          <span id="kChart">گذر لحظهای</span>
          <span class="chart-key"><i class="d"></i><span id="kDown">دانلود</span>
            <i class="u"></i><span id="kUp">آپلود</span></span>
        </div>
        <canvas class="chart" id="chart" width="620" height="190"></canvas>
        <div class="chart-foot">
          <span id="vDown">0 B</span>
          <span class="dot">·</span>
          <span id="vUp">0 B</span>
          <span class="hero-spacer"></span>
          <span id="vRate">0 B/s</span>
        </div>
      </div>

    </div>
  </section>

  <!-- --------------------------------------------------------------- log -->
  <section class="view" id="view-log">
    <div class="logbar">
      <span class="log-title" id="logTitle">گزارش</span>
      <span class="hero-spacer"></span>
      <button class="ghost" id="logCopy">کپی</button>
      <button class="ghost" id="logClear">پاک کردن</button>
      <button class="ghost" id="logFolder">پوشه</button>
    </div>
    <pre class="logbox" id="logBox"></pre>
  </section>

  <!-- ------------------------------------------------------------- about -->
  <section class="view" id="view-about">
    <div class="about" id="about"></div>
  </section>

</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
