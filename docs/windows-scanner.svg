<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="RIX for Windows 1.0.8 edge scanner window: live 128 of 200 progress, the address being probed, ranked address chips, the core to listener to tunnel to exit stage strip, and the proxy and probe buttons">
  <title>RIX for Windows — edge scanner</title>
  <desc>The 1.0.8 Windows scanner view in Persian RTL: the scan card with the live 128 / 200 progress line, the current TCP/TLS address and the best address, six ranked address chips with the best one highlighted, the stage strip from the core through the SOCKS5 listener and tunnel to the exit, and the system-proxy and probe buttons.</desc>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0F111A"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="well" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip">
      <rect x="24" y="20" width="952" height="420" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .fa{font-family:Vazirmatn,'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,monospace}
  </style>

  <rect x="24" y="20" width="952" height="420" rx="14" fill="url(#frame)" stroke="#232A3C"/>
  <g clip-path="url(#windowClip)">
    <ellipse cx="500" cy="360" rx="430" ry="240" fill="url(#well)"/>
  </g>

  <!-- title bar -->
  <g>
    <path d="M38 20 H962 A14 14 0 0 1 976 34 V68 H24 V34 A14 14 0 0 1 38 20 Z" fill="url(#titlebar)"/>
    <line x1="24" y1="68" x2="976" y2="68" stroke="#232A3C"/>

    <rect x="930" y="29" width="32" height="30" rx="8" fill="#171C29" stroke="#232A3C"/>
    <g stroke="#ECEEF6" stroke-width="1.8" stroke-linecap="round">
      <line x1="939" y1="39" x2="953" y2="39"/>
      <line x1="939" y1="44" x2="953" y2="44"/>
      <line x1="939" y1="49" x2="948" y2="49"/>
    </g>
    <line x1="924" y1="32" x2="924" y2="56" stroke="#232A3C"/>
    <rect x="897" y="36" width="17" height="17" rx="5" fill="url(#logo)"/>
    <text x="890" y="50" text-anchor="end" font-size="12.5" font-weight="650" letter-spacing="1.4" fill="#ECEEF6" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">RIX</text>
    <text x="855" y="50" text-anchor="end" font-size="10.5" fill="#5D6376" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">v1.0.8</text>
    <line x1="816" y1="32" x2="816" y2="56" stroke="#232A3C"/>
    <text class="fa" x="808" y="48" direction="rtl" text-anchor="start" font-size="11" fill="#8D93A8">آماده</text>

    <g>
      <g stroke="#8D93A8" stroke-width="1.4" stroke-linecap="round">
        <line x1="43" y1="39" x2="53" y2="49"/>
        <line x1="53" y1="39" x2="43" y2="49"/>
        <rect x="75" y="39" width="10" height="10" rx="1.5" fill="none"/>
        <line x1="107" y1="49" x2="117" y2="49"/>
      </g>
      <line x1="132" y1="32" x2="132" y2="56" stroke="#232A3C"/>
      <text x="148" y="50" text-anchor="middle" font-size="13" fill="#8D93A8">◐</text>
      <text x="180" y="49" text-anchor="middle" font-size="11" fill="#8D93A8" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">EN</text>
      <g fill="#ECEEF6">
        <path transform="translate(204 34) scale(0.9)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </g>
      <g fill="#5EEAD4">
        <path transform="translate(236 34) scale(0.9)" d="M14.9 3.1 2.7 7.8c-.8.3-.8 1.4.1 1.6l3.1.9 1.2 3.6c.2.7 1 .8 1.5.3l1.7-1.6 3.2 2.4c.6.4 1.4.1 1.6-.6l2.2-10.5c.2-.9-.7-1.6-1.5-1.3zM6.4 9.3l7.8-4.7-6.4 5.5-.2 2.4-1.2-3.2z"/>
      </g>
    </g>
  </g>

  <!-- scan card -->
  <g>
    <rect x="70" y="84" width="860" height="160" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <text class="fa" x="916" y="108" direction="rtl" text-anchor="start" font-size="12.5" font-weight="600" fill="#ECEEF6">اسکنر لبه کلودفلر</text>
    <text class="mono" x="812" y="108" text-anchor="end" font-size="10.5" fill="#5D6376">128 / 200</text>

    <rect x="84" y="102" width="52" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="110" y="119" text-anchor="middle" font-size="12" fill="#8D93A8" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">…</text>

    <rect x="84" y="126" width="832" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="84" y="126" width="532" height="3" rx="1.5" fill="url(#progress)"/>

    <text class="mono" x="916" y="150" text-anchor="end" font-size="10.5" fill="#8D93A8">TCP/TLS · 104.28.211.7</text>
    <text class="mono" x="84" y="150" text-anchor="start" font-size="10.5" fill="#8D93A8">104.28.211.7 · 42 ms</text>
    <text class="fa" x="252" y="150" direction="rtl" text-anchor="start" font-size="10.5" fill="#8D93A8">آی‌پی بهینه:</text>

    <g>
      <rect x="766" y="162" width="150" height="22" rx="7" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-opacity="0.42"/>
      <text class="mono" x="841" y="177" text-anchor="middle" font-size="10" fill="#5EEAD4">104.28.211.7:443 · 42ms</text>

      <rect x="620" y="162" width="140" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text class="mono" x="690" y="177" text-anchor="middle" font-size="10" fill="#8D93A8">104.28.209.13:443 · 47ms</text>

      <rect x="474" y="162" width="140" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text class="mono" x="544" y="177" text-anchor="middle" font-size="10" fill="#8D93A8">104.28.210.91:443 · 51ms</text>

      <rect x="328" y="162" width="140" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text class="mono" x="398" y="177" text-anchor="middle" font-size="10" fill="#8D93A8">104.28.214.6:443 · 58ms</text>

      <rect x="182" y="162" width="140" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text class="mono" x="252" y="177" text-anchor="middle" font-size="10" fill="#8D93A8">104.28.213.44:443 · 63ms</text>
    </g>

    <text class="fa" x="916" y="206" direction="rtl" text-anchor="start" font-size="10.5" fill="#5D6376">هر آدرس مستقیم با TCP و TLS آزمایش می‌شود؛ هیچ ترافیکی از تونل عبور نمی‌کند.</text>
    <text class="fa" x="916" y="222" direction="rtl" text-anchor="start" font-size="10.5" fill="#5D6376">اتصال اول همیشه با مسیر خود هسته برقرار می‌شود؛ آدرس اسکن‌شده فقط بعد از شکست آن مسیر آزمایش می‌شود.</text>
  </g>

  <!-- stage strip -->
  <g>
    <rect x="70" y="258" width="860" height="44" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <circle cx="908" cy="280" r="3.5" fill="#34D399"/>
    <text class="fa" x="898" y="284" direction="rtl" text-anchor="start" font-size="11.5" fill="#ECEEF6">هسته</text>
    <text x="858" y="284" text-anchor="middle" font-size="11" fill="#5D6376">→</text>

    <circle cx="842" cy="280" r="3.5" fill="#34D399"/>
    <text class="fa" x="832" y="284" direction="rtl" text-anchor="start" font-size="11.5" fill="#ECEEF6">شنونده SOCKS5</text>
    <text x="724" y="284" text-anchor="middle" font-size="11" fill="#5D6376">→</text>

    <circle cx="708" cy="280" r="3.5" fill="#2E3447"/>
    <text class="fa" x="698" y="284" direction="rtl" text-anchor="start" font-size="11.5" fill="#5D6376">Psiphon</text>
    <text x="642" y="284" text-anchor="middle" font-size="11" fill="#5D6376">→</text>

    <circle cx="626" cy="280" r="3.5" fill="#14B8A6"/>
    <text class="fa" x="616" y="284" direction="rtl" text-anchor="start" font-size="11.5" fill="#ECEEF6">تونل</text>
    <text x="576" y="284" text-anchor="middle" font-size="11" fill="#5D6376">→</text>

    <circle cx="560" cy="280" r="3.5" fill="#2E3447"/>
    <text class="fa" x="550" y="284" direction="rtl" text-anchor="start" font-size="11.5" fill="#5D6376">خروج</text>
  </g>

  <!-- actions -->
  <g>
    <rect x="756" y="316" width="160" height="32" rx="8" fill="#0F111A" stroke="#2E3447"/>
    <text class="fa" x="836" y="336" direction="rtl" text-anchor="middle" font-size="11" fill="#8D93A8">خاموش کردن پروکسی سیستم</text>
    <rect x="698" y="316" width="50" height="32" rx="8" fill="#0F111A" stroke="#2E3447"/>
    <text class="fa" x="723" y="336" direction="rtl" text-anchor="middle" font-size="11" fill="#8D93A8">بررسی</text>
  </g>
</svg>
