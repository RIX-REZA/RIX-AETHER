<svg xmlns="http://www.w3.org/2000/svg" width="440" height="900" viewBox="0 0 440 900" role="img" aria-label="RIX for Android 1.0.8 home screen: hamburger menu, RIX mark, connected badge, hero panel with the connect orb and session clock, the optional-scan tip, down, exit-IP and up tiles, and the tunnel/proxy mode switch">
  <title>RIX for Android — home</title>
  <desc>The 1.0.8 Android home screen in Persian RTL: the hamburger menu and RIX mark in the header with a connected badge, the tinted hero panel with the power orb, session clock and SOCKS5 port, the one-time dismissible scan tip, the down / exit IP / up tiles, and the full-tunnel or SOCKS5 mode switch.</desc>

  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2BD9C4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10141F" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="orbDisc" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#12A08F"/>
      <stop offset="100%" stop-color="#10141F"/>
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2BD9C4" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#2BD9C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#12A08F"/>
    </linearGradient>
    <filter id="deviceShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="30" y="26" width="380" height="848" rx="32"/>
    </clipPath>
  </defs>

  <style>
    .fa{font-family:Vazirmatn,'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,monospace}
  </style>

  <!-- device -->
  <rect x="22" y="18" width="396" height="864" rx="40" fill="#05070C" stroke="#1B2233" stroke-width="2" filter="url(#deviceShadow)"/>
  <rect x="30" y="26" width="380" height="848" rx="32" fill="url(#screenBg)"/>

  <g clip-path="url(#screenClip)">
    <ellipse cx="120" cy="160" rx="230" ry="210" fill="url(#well)"/>
    <ellipse cx="360" cy="770" rx="220" ry="200" fill="url(#well)" opacity="0.65"/>

    <!-- status bar -->
    <text class="mono" x="220" y="50" text-anchor="middle" font-size="10" fill="#8D93A8">12:04</text>

    <!-- header: menu and mark at the start (right), status badge at the end (left) -->
    <g>
      <rect x="352" y="58" width="40" height="40" rx="12" fill="#171C29" stroke="#232A3C"/>
      <g stroke="#ECEEF6" stroke-width="2" stroke-linecap="round">
        <line x1="362" y1="72" x2="382" y2="72"/>
        <line x1="362" y1="78" x2="382" y2="78"/>
        <line x1="362" y1="84" x2="374" y2="84"/>
      </g>

      <circle cx="320" cy="78" r="22" fill="url(#logoRing)"/>
      <circle cx="320" cy="78" r="20" fill="#0B0E17"/>
      <path d="M325.2 66.4 L315.4 79.8 L320.2 79.8 L317.4 89.6 L326.6 75.8 L321.8 75.8 Z" fill="#2BD9C4"/>

      <text x="287" y="76" text-anchor="end" font-size="22" font-weight="700" letter-spacing="0.5" fill="#ECEEF6" font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">RIX</text>
      <text class="fa" x="287" y="94" direction="rtl" text-anchor="start" font-size="10" fill="#8D93A8">تونل امن WARP / MASQUE</text>

      <rect x="48" y="64" width="78" height="28" rx="14" fill="#2BD9C4" fill-opacity="0.12" stroke="#2BD9C4" stroke-opacity="0.45"/>
      <circle cx="110" cy="78" r="3.5" fill="#2BD9C4"/>
      <text class="fa" x="102" y="82" direction="rtl" text-anchor="start" font-size="10.5" fill="#2BD9C4">متصل</text>
    </g>

    <!-- hero: status, orb, clock, socks port -->
    <g>
      <rect x="48" y="114" width="344" height="380" rx="30" fill="url(#hero)" stroke="#2BD9C4" stroke-opacity="0.24"/>

      <text class="fa" x="220" y="156" direction="rtl" text-anchor="middle" font-size="19" font-weight="600" fill="#ECEEF6">تونل برقرار است</text>
      <text class="fa" x="220" y="178" direction="rtl" text-anchor="middle" font-size="10.5" fill="#8D93A8">MASQUE / HTTP-2 · اسکن پیش‌فرض · لبهٔ FRA</text>

      <circle cx="220" cy="296" r="112" fill="none" stroke="#2BD9C4" stroke-opacity="0.06" stroke-width="2"/>
      <circle cx="220" cy="296" r="98" fill="none" stroke="#2BD9C4" stroke-opacity="0.10" stroke-width="2"/>
      <circle cx="220" cy="296" r="86" fill="none" stroke="#2BD9C4" stroke-opacity="0.14" stroke-width="2"/>
      <circle cx="220" cy="296" r="100" fill="none" stroke="#2BD9C4" stroke-opacity="0.16" stroke-width="3"/>
      <circle cx="220" cy="296" r="75" fill="url(#orbDisc)" stroke="#2BD9C4" stroke-opacity="0.75" stroke-width="1.5"/>
      <circle cx="220" cy="296" r="18" fill="none" stroke="#2BD9C4" stroke-width="5" stroke-linecap="round" stroke-dasharray="87 26" transform="rotate(-58 220 296)"/>
      <line x1="220" y1="270" x2="220" y2="292" stroke="#2BD9C4" stroke-width="5" stroke-linecap="round"/>
      <text class="fa" x="220" y="348" direction="rtl" text-anchor="middle" font-size="14" font-weight="600" fill="#ECEEF6">قطع</text>

      <text class="mono" x="220" y="442" text-anchor="middle" font-size="26" fill="#ECEEF6">12:04</text>
      <text class="mono" x="220" y="466" text-anchor="middle" font-size="12" fill="#8D93A8">127.0.0.1:1819</text>
    </g>

    <!-- one-time scan tip -->
    <g>
      <rect x="48" y="508" width="344" height="88" rx="16" fill="#2BD9C4" fill-opacity="0.10" stroke="#2BD9C4" stroke-opacity="0.35"/>
      <text class="fa" x="378" y="534" direction="rtl" text-anchor="start" font-size="11" fill="#ECEEF6">برای اتصال بهتر می‌توانی از منوی همبرگری</text>
      <text class="fa" x="378" y="552" direction="rtl" text-anchor="start" font-size="11" fill="#ECEEF6">یک اسکن تازه بزنی و آی‌پی جدید بگیری.</text>
      <text class="fa" x="378" y="576" direction="rtl" text-anchor="start" font-size="9.5" fill="#8D93A8">اتصال بدون اسکن هم همیشه کار می‌کند.</text>
      <g stroke="#8D93A8" stroke-width="1.6" stroke-linecap="round">
        <line x1="64" y1="534" x2="76" y2="546"/>
        <line x1="76" y1="534" x2="64" y2="546"/>
      </g>
    </g>

    <!-- down, exit IP, up -->
    <g>
      <rect x="48" y="610" width="94" height="76" rx="18" fill="#10141F" fill-opacity="0.92" stroke="#232A3C"/>
      <path d="M130 639 v-12 M125 632 l5-6 5 6" fill="none" stroke="#2BD9C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="fa" x="120" y="640" direction="rtl" text-anchor="start" font-size="10" fill="#8D93A8">ارسال</text>
      <text class="mono" x="130" y="670" text-anchor="end" font-size="15" fill="#ECEEF6">318 KB</text>

      <rect x="152" y="610" width="136" height="76" rx="18" fill="#10141F" fill-opacity="0.92" stroke="#2BD9C4" stroke-opacity="0.35"/>
      <circle cx="244" cy="629" r="5" fill="none" stroke="#2BD9C4" stroke-width="1.3"/>
      <path d="M239 629 h10 M244 624 v10" stroke="#2BD9C4" stroke-width="1.1"/>
      <text class="fa" x="238" y="633" direction="rtl" text-anchor="start" font-size="10" fill="#8D93A8">آی‌پی خروجی</text>
      <text class="mono" x="220" y="656" text-anchor="middle" font-size="13" font-weight="600" fill="#ECEEF6">104.28.211.7</text>
      <text class="mono" x="220" y="673" text-anchor="middle" font-size="9" fill="#8D93A8">FRA · DE</text>

      <rect x="298" y="610" width="94" height="76" rx="18" fill="#10141F" fill-opacity="0.92" stroke="#232A3C"/>
      <path d="M380 632 v12 M375 639 l5 6 5-6" fill="none" stroke="#2BD9C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="fa" x="370" y="640" direction="rtl" text-anchor="start" font-size="10" fill="#8D93A8">دریافت</text>
      <text class="mono" x="380" y="670" text-anchor="end" font-size="15" fill="#ECEEF6">2.41 MB</text>
    </g>

    <!-- mode switch -->
    <g>
      <rect x="48" y="702" width="344" height="44" rx="16" fill="#10141F" stroke="#232A3C"/>
      <rect x="222" y="706" width="166" height="36" rx="12" fill="#2BD9C4" fill-opacity="0.22"/>
      <text class="fa" x="305" y="729" direction="rtl" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ECEEF6">تونل کامل</text>
      <text class="fa" x="135" y="729" direction="rtl" text-anchor="middle" font-size="12.5" fill="#8D93A8">پروکسی (SOCKS5)</text>
    </g>

    <text class="fa" x="220" y="768" direction="rtl" text-anchor="middle" font-size="10.5" fill="#8D93A8">برای تغییر حالت، اول اتصال را قطع کن.</text>

    <rect x="184" y="846" width="72" height="4" rx="2" fill="#232A3C"/>
  </g>
</svg>
