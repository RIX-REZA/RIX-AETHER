<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-label="RIX settings screen: five presets and the automatic protocol rotation switch">
  <title>RIX — settings and presets</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
    <radialGradient id="wellV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .fa { font-family: Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif; }
      .en { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .hint { font-size: 10.5px; fill: #8D93A8; }
      .name { font-size: 14px; fill: #ECEEF6; }
    </style>
  </defs>

  <rect width="900" height="580" rx="28" fill="url(#bg)" stroke="#232A3C"/>
  <ellipse cx="130" cy="70" rx="380" ry="220" fill="url(#wellV)"/>
  <ellipse cx="790" cy="250" rx="330" ry="220" fill="url(#wellW)"/>

  <!-- header -->
  <text class="en" x="40" y="48" text-anchor="start" font-size="11" fill="#8D93A8">RIX &#183; v1.0.8</text>
  <text class="fa" x="450" y="52" direction="rtl" text-anchor="middle" font-size="22" font-weight="700" fill="#ECEEF6">تنظیمات</text>
  <text class="fa" x="450" y="78" direction="rtl" text-anchor="middle" font-size="11" fill="#8D93A8">پنج پریست آماده، هر کدام یک بستهٔ هماهنگ از تنظیمات</text>

  <!-- preset 1: default -->
  <g>
    <rect x="40" y="130" width="820" height="60" rx="16" fill="#10141F" stroke="#232A3C"/>
    <circle cx="72" cy="160" r="9" fill="none" stroke="#232A3C" stroke-width="1.5"/>
    <rect x="794" y="145" width="30" height="30" rx="9" fill="#8D93A8" fill-opacity="0.12" stroke="#8D93A8" stroke-opacity="0.3"/>
    <circle cx="809" cy="160" r="6" fill="none" stroke="#8D93A8" stroke-width="1.6"/>
    <text class="fa name" x="449" y="157" direction="rtl" text-anchor="middle">پیش‌فرض</text>
    <text class="fa hint" x="449" y="176" direction="rtl" text-anchor="middle">MASQUE/HTTP-3 • اسکن پیش‌فرض</text>
    <rect x="850" y="142" width="4" height="36" rx="2" fill="#8D93A8" fill-opacity="0.35"/>
  </g>

  <!-- preset 2: iran, active -->
  <g>
    <rect x="40" y="198" width="820" height="60" rx="16" fill="#10202B" stroke="#38BDF8" stroke-opacity="0.55"/>
    <circle cx="72" cy="228" r="9" fill="#2BD9C4"/>
    <path d="M 68.5 228 l 2.6 2.7 l 4.6 -5.4" fill="none" stroke="#06121A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="en" x="112" y="232" text-anchor="start" font-size="10" fill="#2BD9C4">ACTIVE</text>
    <rect x="794" y="213" width="30" height="30" rx="9" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.4"/>
    <path d="M 809 221 L 815 224 V 228.5 C 815 232.5 812 234.6 809 235.4 C 806 234.6 803 232.5 803 228.5 V 224 Z" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round"/>
    <text class="fa name" x="449" y="225" direction="rtl" text-anchor="middle" fill="#38BDF8">ایران (مقاوم)</text>
    <text class="fa hint" x="449" y="244" direction="rtl" text-anchor="middle">MASQUE/HTTP-2 روی TCP 443، با Fragment و اسکن کامل</text>
    <rect x="850" y="210" width="4" height="36" rx="2" fill="#38BDF8"/>
  </g>

  <!-- preset 3: fastest -->
  <g>
    <rect x="40" y="266" width="820" height="60" rx="16" fill="#10141F" stroke="#232A3C"/>
    <circle cx="72" cy="296" r="9" fill="none" stroke="#232A3C" stroke-width="1.5"/>
    <rect x="794" y="281" width="30" height="30" rx="9" fill="#2BD9C4" fill-opacity="0.12" stroke="#2BD9C4" stroke-opacity="0.3"/>
    <path d="M 811 289 L 805 296.5 L 808.6 296.5 L 807 303 L 813.4 295 L 809.8 295 Z" fill="#2BD9C4"/>
    <text class="fa name" x="449" y="293" direction="rtl" text-anchor="middle">سریع‌ترین</text>
    <text class="fa hint" x="449" y="312" direction="rtl" text-anchor="middle">MASQUE/HTTP-3 با اسکن Turbo و پروفایل پرقدرت</text>
    <rect x="850" y="278" width="4" height="36" rx="2" fill="#2BD9C4" fill-opacity="0.35"/>
  </g>

  <!-- preset 4: anti dpi -->
  <g>
    <rect x="40" y="334" width="820" height="60" rx="16" fill="#10141F" stroke="#232A3C"/>
    <circle cx="72" cy="364" r="9" fill="none" stroke="#232A3C" stroke-width="1.5"/>
    <rect x="794" y="349" width="30" height="30" rx="9" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.3"/>
    <rect x="803.8" y="358.8" width="10.4" height="10.4" rx="1.6" fill="none" stroke="#38BDF8" stroke-width="1.6" transform="rotate(45 809 364)"/>
    <text class="fa name" x="449" y="361" direction="rtl" text-anchor="middle">ضد DPI</text>
    <text class="fa hint" x="449" y="380" direction="rtl" text-anchor="middle">MASQUE در MASQUE، اسکن کامل و Fragment</text>
    <rect x="850" y="346" width="4" height="36" rx="2" fill="#38BDF8" fill-opacity="0.35"/>
  </g>

  <!-- preset 5: low power -->
  <g>
    <rect x="40" y="402" width="820" height="60" rx="16" fill="#10141F" stroke="#232A3C"/>
    <circle cx="72" cy="432" r="9" fill="none" stroke="#232A3C" stroke-width="1.5"/>
    <rect x="794" y="417" width="30" height="30" rx="9" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.3"/>
    <rect x="803" y="428" width="11" height="8" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <path d="M 815.6 430.6 V 433.4" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
    <text class="fa name" x="449" y="429" direction="rtl" text-anchor="middle">کم‌مصرف</text>
    <text class="fa hint" x="449" y="448" direction="rtl" text-anchor="middle">WireGuard، پروفایل کم‌مصرف و Keepalive بلند</text>
    <rect x="850" y="414" width="4" height="36" rx="2" fill="#38BDF8" fill-opacity="0.35"/>
  </g>

  <!-- auto rotation -->
  <g>
    <rect x="40" y="478" width="820" height="66" rx="16" fill="#0B1B2A" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="64" y="498" width="48" height="26" rx="13" fill="#0EA5E9"/>
    <circle cx="99" cy="511" r="10" fill="#ECEEF6"/>
    <text class="fa name" x="449" y="505" direction="rtl" text-anchor="middle" font-size="13.5">چرخش خودکار پروتکل</text>
    <text class="fa hint" x="449" y="525" direction="rtl" text-anchor="middle">اگر پروتکل انتخابی تونل را برقرار نکرد، MASQUE/HTTP-2 و بعد Gool و MASQUE در MASQUE امتحان می‌شوند</text>
  </g>
</svg>