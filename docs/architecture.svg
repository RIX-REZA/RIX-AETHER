<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="RIX packet path: apps to TUN to hev to SOCKS5 to the Aether core to the WARP edge">
  <title>RIX — packet path</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B16"/>
      <stop offset="100%" stop-color="#07070D"/>
    </linearGradient>
    <radialGradient id="wellV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8F7BFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8F7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2BD9C4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2BD9C4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8F7BFF" fill-opacity="0.65"/>
    </marker>
    <style>
      .fa { font-family: Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif; }
      .en { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .box { fill: #10101F; stroke: #23233C; }
      .lbl { font-size: 14px; fill: #EFEDFF; }
      .sub { font-size: 10px; fill: #8E8BAD; }
      .lane { font-size: 11px; fill: #8F7BFF; letter-spacing: 1.6px; }
    </style>
  </defs>

  <rect width="1000" height="430" rx="28" fill="url(#bg)" stroke="#23233C"/>
  <ellipse cx="90" cy="40" rx="380" ry="200" fill="url(#wellV)"/>
  <ellipse cx="930" cy="400" rx="380" ry="200" fill="url(#wellT)"/>

  <text class="fa" x="500" y="44" direction="rtl" text-anchor="middle" font-size="19" font-weight="600" fill="#EFEDFF">مسیر بسته‌ها</text>
  <text class="en" x="500" y="66" text-anchor="middle" font-size="11" fill="#8E8BAD">packet path</text>

  <!-- ===== lane 1: full tunnel ===== -->
  <text class="en lane" x="30" y="100" text-anchor="start">FULL TUNNEL</text>

  <g>
    <rect class="box" x="30"  y="112" width="156" height="86" rx="16"/>
    <text class="fa" x="108" y="146" direction="rtl" text-anchor="middle" font-size="13" fill="#EFEDFF">همهٔ برنامه‌ها</text>
    <text class="en sub" x="108" y="168" text-anchor="middle">every app</text>
    <text class="en sub" x="108" y="184" text-anchor="middle">Wi-Fi · mobile data</text>
  </g>

  <g>
    <rect class="box" x="226" y="112" width="156" height="86" rx="16"/>
    <text class="en" x="304" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#EFEDFF">TUN</text>
    <text class="en sub" x="304" y="168" text-anchor="middle">VpnService</text>
    <text class="fa sub" x="304" y="184" direction="rtl" text-anchor="middle">۱۰.۸۷.۰.۲/۳۰</text>
  </g>

  <g>
    <rect class="box" x="422" y="112" width="156" height="86" rx="16"/>
    <text class="en" x="500" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#EFEDFF">hev</text>
    <text class="en sub" x="500" y="168" text-anchor="middle">lwip tun2socks</text>
    <text class="fa sub" x="500" y="184" direction="rtl" text-anchor="middle">پل TCP/IP فضای کاربر</text>
  </g>

  <g>
    <rect x="618" y="112" width="156" height="86" rx="16" fill="#141230" stroke="#5B45D6"/>
    <text class="en" x="696" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#8F7BFF">aether</text>
    <text class="en sub" x="696" y="168" text-anchor="middle">Rust core</text>
    <text class="fa sub" x="696" y="184" direction="rtl" text-anchor="middle">MASQUE / WireGuard</text>
  </g>

  <g>
    <rect x="814" y="112" width="156" height="86" rx="16" fill="#0D2422" stroke="#12A08F"/>
    <text class="en" x="892" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#2BD9C4">WARP</text>
    <text class="en sub" x="892" y="168" text-anchor="middle">Cloudflare edge</text>
    <text class="en sub" x="892" y="184" text-anchor="middle">internet</text>
  </g>

  <g stroke="#8F7BFF" stroke-opacity="0.65" marker-end="url(#arrow)">
    <line x1="186" y1="155" x2="222" y2="155"/>
    <line x1="382" y1="155" x2="418" y2="155"/>
    <line x1="578" y1="155" x2="614" y2="155"/>
    <line x1="774" y1="155" x2="810" y2="155"/>
  </g>
  <text class="mono" x="598" y="104" text-anchor="middle" font-size="9.5" fill="#8F7BFF">SOCKS5</text>
  <text class="mono" x="598" y="216" text-anchor="middle" font-size="9" fill="#8E8BAD">:1819</text>

  <!-- ===== lane 2: proxy only ===== -->
  <text class="en lane" x="30" y="286" text-anchor="start">PROXY ONLY</text>

  <g>
    <rect class="box" x="50" y="298" width="240" height="88" rx="16"/>
    <text class="fa" x="170" y="332" direction="rtl" text-anchor="middle" font-size="13" fill="#EFEDFF">یک برنامه یا مرورگر</text>
    <text class="en sub" x="170" y="354" text-anchor="middle">no TUN, no capture</text>
    <text class="fa sub" x="170" y="370" direction="rtl" text-anchor="middle">هیچ بسته‌ای گرفته نمی‌شود</text>
  </g>

  <g>
    <rect x="350" y="298" width="300" height="88" rx="16" fill="#141230" stroke="#5B45D6"/>
    <text class="en" x="500" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#8F7BFF">aether</text>
    <text class="mono" x="500" y="352" text-anchor="middle" font-size="10" fill="#EFEDFF">SOCKS5 127.0.0.1:1819</text>
    <text class="fa sub" x="500" y="370" direction="rtl" text-anchor="middle">خودِ هسته پروکسی را سرو می‌کند</text>
  </g>

  <g>
    <rect x="710" y="298" width="240" height="88" rx="16" fill="#0D2422" stroke="#12A08F"/>
    <text class="en" x="830" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#2BD9C4">WARP</text>
    <text class="en sub" x="830" y="356" text-anchor="middle">Cloudflare edge</text>
    <text class="en sub" x="830" y="372" text-anchor="middle">internet</text>
  </g>

  <g stroke="#8F7BFF" stroke-opacity="0.65" marker-end="url(#arrow)">
    <line x1="290" y1="342" x2="346" y2="342"/>
    <line x1="650" y1="342" x2="706" y2="342"/>
  </g>

  <text class="fa" x="500" y="412" direction="rtl" text-anchor="middle" font-size="10.5" fill="#8E8BAD">هسته خودش دستگاه TUN نمی‌سازد و فقط SOCKS5 سرو می‌کند؛ همین دلیل وجود لایهٔ tun2socks است</text>
</svg>
