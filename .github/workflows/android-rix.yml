name: RIX Android build

# Three jobs, cheapest first:
#   kotlin  type-checks the app in ~4 min so a Kotlin typo never burns a 40 min
#           native build
#   native  builds libaether.so (BoringSSL + quiche + boringtun, cross-compiled)
#           and libhev-socks5-tunnel.so per ABI
#   apk     packages both into the APK and refuses to upload unless all three
#           .so files are actually inside it
#
# The native half needs BoringSSL, quiche and boringtun cross-compiled with the
# NDK, which wants a real runner: several GB of disk and ~40 minutes of CPU. If
# you build locally instead, gradle.properties allows a 3 GB heap, so give the
# daemon more than that or `:app:compileDebugKotlin` will be killed.

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "Comma-separated ABIs to build"
        required: false
        default: "arm64-v8a"
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "keystore/**"
      - ".github/workflows/android-rix.yml"

permissions:
  contents: read

env:
  AETHER_REPO: https://github.com/CluvexStudio/Aether
  AETHER_REF: v2.4.0
  HEV_TAG: "2.19.3"
  NDK_VERSION: "26.1.10909125"

jobs:
  kotlin:
    name: kotlin compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Refuse committed signing material
        # A private key in a public repository is a published key, and this one
        # was published: the file has been removed from the tree and is being
        # rotated, and this check is what keeps the next one from being added by
        # accident. The key CI signs with now comes from RIX_KEYSTORE_B64.
        run: |
          set -euo pipefail
          found=$(git ls-files -- '*.p12' '*.jks' '*.keystore' 'keystore/**' || true)
          if [ -n "$found" ]; then
            echo "::error::Signing material is tracked in git:"
            echo "$found"
            echo "::error::Remove it; store keys in the RIX_KEYSTORE_B64 repository secret -- never a variable, which CI prints. See SECURITY.md."
            exit 1
          fi
          echo "no signing material is tracked"

      - name: Install Android SDK packages
        # android-actions/setup-android@v3 is unusable here: it runs
        # `sdkmanager tools`, and the deprecated `tools` package no longer exists
        # in the SDK repository ("Failed to find package 'tools'"). The runner
        # image already ships an SDK, so drive sdkmanager directly.
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -x "$SDKMGR" ] || SDKMGR=$(command -v sdkmanager)
          echo "sdkmanager: $SDKMGR"

          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" \
                    "cmake;3.22.1" "ndk;${NDK_VERSION}" >/dev/null
          ls "${ANDROID_HOME}/ndk"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Kotlin
        working-directory: .
        run: |
          gradle :app:compileDebugKotlin -PrixAbis=arm64-v8a --no-daemon --stacktrace

      - name: Unit tests
        # Pure JVM tests: configuration validation and probe-response parsing.
        # They need no device, no native library and no network, which is why
        # they run in the cheap job before any native build.
        working-directory: .
        run: |
          gradle :app:testDebugUnitTest -PrixAbis=arm64-v8a --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rix-unit-tests
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  native:
    name: native (${{ matrix.abi }})
    needs: kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
          - abi: armeabi-v7a
            rust: armv7-linux-androideabi
          - abi: x86_64
            rust: x86_64-linux-android
          - abi: x86
            rust: i686-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - name: Install Go (BoringSSL build)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake, Ninja and Perl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake perl

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch Aether
        run: |
          git clone --depth 1 --branch "${AETHER_REF}" "${AETHER_REPO}" aether-src
          echo "aether $(git -C aether-src rev-parse --short HEAD)"
          test -f aether-src/quiche/quiche/Cargo.toml

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aether-src/aether -> target"
          key: ${{ matrix.abi }}

      - name: Build libaether.so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
        run: |
          set -euo pipefail
          under=$(echo "${{ matrix.rust }}" | tr '-' '_')
          export "BORING_BSSL_RUST_CPPLIB_${under}=static:-bundle=c++"

          cd aether-src/aether
          cargo ndk -t ${{ matrix.abi }} --platform 29 build --release --lib

          so="target/${{ matrix.rust }}/release/libaether.so"
          ls -lh "$so"
          file "$so"
          readelf -d "$so" | grep NEEDED || true

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/${{ matrix.abi }}"
          cp "$so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/${{ matrix.abi }}/"

      - name: Fetch hev-socks5-tunnel
        run: |
          curl -sSL -o hev.tar.xz \
            "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_TAG}/hev-socks5-tunnel-${HEV_TAG}.tar.xz"
          tar -xJf hev.tar.xz
          mv "hev-socks5-tunnel-${HEV_TAG}" hev-src

      - name: Build libhev-socks5-tunnel.so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd hev-src
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_ABI=${{ matrix.abi }} \
            APP_PLATFORM=android-29 \
            -j"$(nproc)"

          so="libs/${{ matrix.abi }}/libhev-socks5-tunnel.so"
          ls -lh "$so"
          file "$so"

          cp "$so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/${{ matrix.abi }}/"

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: rix-native-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}/*.so
          if-no-files-found: error

  apk:
    name: apk (${{ matrix.abi }})
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            name: v8
          - abi: armeabi-v7a
            name: v7
          - abi: x86_64
            name: x86_64
          - abi: x86
            name: x86
          - abi: arm64-v8a,armeabi-v7a,x86_64,x86
            name: universal
    # Job-level permissions replace the workflow-level block for this job, so
    # all three are repeated here. The two write scopes are what the attestation
    # step needs and nothing else: an OIDC token to sign with, and permission to
    # write the attestation. Neither one can push a commit or edit a release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        # Same reason as the kotlin job: setup-android@v3 is broken upstream.
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -x "$SDKMGR" ] || SDKMGR=$(command -v sdkmanager)
          echo "sdkmanager: $SDKMGR"

          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" \
                    "cmake;3.22.1" "ndk;${NDK_VERSION}" >/dev/null

      - name: Collect native libraries for ${{ matrix.abi }}
        uses: actions/download-artifact@v4
        with:
          pattern: rix-native-*
          path: _native

      - name: Place libraries into jniLibs
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${{ matrix.name }}" = "universal" ]; then
            for dir in _native/rix-native-*; do
              abi="${dir##*rix-native-}"
              mkdir -p "app/src/main/jniLibs/${abi}"
              cp "${dir}"/*.so "app/src/main/jniLibs/${abi}/"
              echo "collected ${abi}: $(ls "${dir}" | tr '\n' ' ')"
            done
          else
            abi="${{ matrix.abi }}"
            dir="_native/rix-native-${abi}"
            mkdir -p "app/src/main/jniLibs/${abi}"
            cp "${dir}"/*.so "app/src/main/jniLibs/${abi}/"
            echo "collected ${abi}: $(ls "${dir}" | tr '\n' ' ')"
          fi
          find app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        # The key is NOT in the repository: it was published in git history once
        # and that makes it compromised for any future use (see SECURITY.md).
        # Builds keep signing with it only so that existing installations can
        # still update in place; a rotation that would break API 24-27 updates
        # is a separate, deliberate release, never a silent side effect.
        #
        # The secret is the only path that keeps the key out of the log, and it
        # is what this should use. It is checked first for that reason.
        #
        # The variable fallback stays, and it is a deliberate trade rather than
        # an oversight. GitHub masks a value only when it is a registered
        # secret, and it prints every step's `env:` block, so taking the value
        # from `vars` puts the base64 of rix.p12 -- private key included -- in
        # this step's env block, on a public repository. That is real, and it is
        # warned about below on every run that takes this path.
        #
        # It is kept anyway because refusing it buys nothing here: this key was
        # committed to this public repository once already and SECURITY.md
        # documents it as compromised, with continued signing as a deliberate
        # choice so that installed apps can still update in place. A key that is
        # already public does not become more public by being printed again; the
        # only thing removing the fallback achieved was a build that stopped.
        #
        # The rotation in SECURITY.md is what actually fixes this: move the new
        # key into the *secret*, delete the variable, and set RIX_KEYSTORE_PASS
        # so no password lives in build.gradle.kts. Then this fallback is dead
        # code and the warning below never fires.
        env:
          RIX_KEYSTORE_SECRET: ${{ secrets.RIX_KEYSTORE_B64 }}
          RIX_KEYSTORE_VAR: ${{ vars.RIX_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          key="keystore/rix.p12"

          b64="${RIX_KEYSTORE_SECRET:-}"
          if [ -n "$b64" ]; then
            echo "signing key written from secret RIX_KEYSTORE_B64"
          else
            b64="${RIX_KEYSTORE_VAR:-}"
            if [ -z "$b64" ]; then
              echo "::error::$key cannot be restored: neither secrets.RIX_KEYSTORE_B64 nor vars.RIX_KEYSTORE_B64 is set."
              echo "::error::An unsigned build cannot update an installed app. See SECURITY.md."
              exit 1
            fi
            # Loud on purpose, and once per run: this is the path that publishes
            # the key, and it should stop being taken.
            echo "::warning::Signing from repository variable RIX_KEYSTORE_B64. Its value is in this step's env block above, in the clear, because GitHub masks secrets and not variables. This key is already public (see SECURITY.md) so this run does not make it more so -- but move the value into the secret and delete the variable."
            echo "signing key written from variable RIX_KEYSTORE_B64 (exposed; see the warning above)"
          fi

          mkdir -p "$(dirname "$key")"
          printf '%s' "$b64" | base64 -d > "$key"
          chmod 600 "$key"
          ls -l "$key"

      - name: Assemble debug APK for ${{ matrix.name }}
        working-directory: .
        run: |
          if [ "${{ matrix.name }}" = "universal" ]; then
            gradle :app:assembleDebug -PrixAbis="arm64-v8a,armeabi-v7a,x86_64,x86" --no-daemon --stacktrace
          else
            gradle :app:assembleDebug -PrixAbis="${{ matrix.abi }}" --no-daemon --stacktrace
          fi

      - name: Verify APK contents
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "universal" ]; then
            apk=$(find app/build/outputs/apk/debug -name '*universal*.apk' -o -name '*all*.apk' | head -1)
          else
            # Match exactly the ABI in the APK name (e.g., app-x86-debug.apk, not app-x86_64-debug.apk)
            apk=$(find app/build/outputs/apk/debug -name "*${{ matrix.abi }}-debug.apk" | head -1)
          fi
          [ -n "$apk" ] || { echo "ERROR: APK not found for ${{ matrix.name }}"; exit 1; }
          echo "APK=$apk"
          unzip -l "$apk" | grep -E 'lib/.*\.so' || { echo "ERROR: no .so in APK"; exit 1; }
          for need in libaether.so libhev-socks5-tunnel.so librixjni.so; do
            unzip -l "$apk" | grep -q "$need" || { echo "ERROR: $need missing from APK"; exit 1; }
          done

          # The signature is what lets an update install over the previous
          # version; print it so a key change shows up in the build log.
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs "$apk" | head -6

      - name: Rename APK to Rix-aether-${{ matrix.name }}.apk
        run: |
          if [ "${{ matrix.name }}" = "universal" ]; then
            apk=$(find app/build/outputs/apk/debug -name '*universal*.apk' -o -name '*all*.apk' | head -1)
          else
            # Match exactly the ABI in the APK name (e.g., app-x86-debug.apk, not app-x86_64-debug.apk)
            apk=$(find app/build/outputs/apk/debug -name "*${{ matrix.abi }}-debug.apk" | head -1)
          fi
          target="app/build/outputs/apk/debug/Rix-aether-${{ matrix.name }}.apk"
          mv "$apk" "$target"
          echo "APK_PATH=$target" >> "$GITHUB_ENV"

      - name: Attest the build provenance of the APK
        # The signing key was published in this repository's history, so a
        # signature only proves that a file was not signed by some *other* key
        # (SECURITY.md). Provenance is the check a copy cannot pass: GitHub
        # signs a statement that binds the APK's digest to this workflow and
        # this commit, and no fork can obtain one for its own binary.
        #
        # `gh attestation verify <file> --repo RIX-REZA/RIX-AETHER` is the other
        # end of this step, and it is documented in the README.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.APK_PATH }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rix-apk-${{ matrix.name }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error